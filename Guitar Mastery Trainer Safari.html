.gmt-app {
  --bg: #221410;
  --card: #36241A;
  --amber: #D9A05C;
  --amber-dark: #E8B978;
  --brass: #D9A441;
  --brass-dark: #F0C878;
  --moss: #7E9463;
  --moss-dark: #A8C088;
  --mahogany: #A85D36;
  --mahogany-dark: #401F0D;
  --mahogany-light: #E0A87C;
  --burst-center: #F0C97A;
  --burst-edge: #6B2712;
  --ink: #F0E4D0;
  --ink-soft: #C9AD8C;
  --border: rgba(240,228,208,0.14);
  --shadow: rgba(0,0,0,0.35);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background:
    repeating-linear-gradient(98deg, rgba(217,164,65,0.045) 0px, rgba(217,164,65,0.045) 2px, transparent 2px, transparent 8px),
    repeating-linear-gradient(98deg, rgba(240,201,122,0.035) 0px, rgba(240,201,122,0.035) 1px, transparent 1px, transparent 16px),
    var(--bg);
  color: var(--ink);
  height: 100%;
  width: 100%;
  position: relative;
  -webkit-font-smoothing: antialiased;
}
.gmt-app * { box-sizing: border-box; }
.gmt-app button { font-family: inherit; cursor: pointer; }
.gmt-app input, .gmt-app textarea, .gmt-app select { font-family: inherit; }
.gmt-display { font-family: 'Fraunces', Georgia, serif; }
.gmt-scroll { -ms-overflow-style: none; scrollbar-width: none; }
.gmt-scroll::-webkit-scrollbar { display: none; }
@keyframes gmt-fade-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.gmt-fade-in { animation: gmt-fade-in 0.35s ease both; }
@keyframes gmt-pop { 0% { transform: scale(0.9); opacity: 0; } 60% { transform: scale(1.03); opacity: 1; } 100% { transform: scale(1); } }
.gmt-pop { animation: gmt-pop 0.4s cubic-bezier(.2,.8,.3,1.2) both; }
@keyframes gmt-pulse-ring {
  0% { transform: scale(0.85); opacity: 0.9; }
  70% { transform: scale(1.35); opacity: 0; }
  100% { transform: scale(1.35); opacity: 0; }
}
@keyframes gmt-beat-pop { 0% { transform: scale(1); } 30% { transform: scale(1.12); } 100% { transform: scale(1); } }
@keyframes gmt-float-up {
  0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
  10% { opacity: 1; }
  100% { transform: translateY(-220px) translateX(var(--drift, 20px)) rotate(180deg); opacity: 0; }
}
@keyframes gmt-sunbeam-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes gmt-sparkle { 0%, 100% { opacity: 0.2; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.15); } }
@keyframes gmt-listen-pulse { 0%, 100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
@keyframes gmt-slot-glow { 0% { box-shadow: 0 0 0 0 rgba(217,164,65,0.6); } 100% { box-shadow: 0 0 0 10px rgba(217,164,65,0); } }
@keyframes gmt-drawer-slide { from { transform: translateX(100%); } to { transform: translateX(0); } }
.gmt-connection-panel { animation: gmt-drawer-slide 0.28s cubic-bezier(.2,.8,.3,1) both; }
.gmt-tab-btn { transition: color 0.2s ease, transform 0.15s ease; }
.gmt-tab-btn:active { transform: scale(0.92); }
.gmt-card { background: var(--card); border: 1px solid var(--border); box-shadow: 0 2px 10px var(--shadow); }
.gmt-btn-primary { background: var(--mahogany); color: #fff; border: none; box-shadow: 0 3px 0 var(--mahogany-dark); transition: transform 0.12s ease, box-shadow 0.12s ease; }
.gmt-btn-primary:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--mahogany-dark); }
.gmt-btn-primary:disabled { opacity: 0.45; box-shadow: none; cursor: not-allowed; }
.gmt-chip { transition: all 0.15s ease; }
.gmt-chip:active { transform: scale(0.96); }
.gmt-rosette {
  box-shadow:
    0 0 0 3px var(--card),
    0 0 0 5px var(--brass-dark),
    0 0 0 8px var(--card),
    0 0 0 10px var(--amber-dark);
}
.gmt-tortoise {
  background:
    radial-gradient(ellipse at 20% 30%, rgba(46,27,16,0.5) 0%, transparent 45%),
    radial-gradient(ellipse at 70% 60%, rgba(168,95,38,0.55) 0%, transparent 40%),
    radial-gradient(ellipse at 45% 80%, rgba(46,27,16,0.4) 0%, transparent 35%),
    radial-gradient(ellipse at 85% 15%, rgba(217,164,65,0.5) 0%, transparent 40%),
    #3E2414;
}
